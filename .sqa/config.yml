config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/eosc-kc/keycloak:
      branch: master
      repo: https://github.com/eosc-kc/keycloak.git
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/eosc-kc/keycloak git:
        commands:
        - /usr/bin/env sh .sqa/script.bronze_visionary_gull.sh
        container: qc.acc_polar_balanced_condor
  QC.Doc:
    repos:
      github.com/eosc-kc/keycloak find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.cobalt_bright_emu.sh
        container: qc.doc_umber_shrewd_crane
      github.com/eosc-kc/keycloak git:
        commands:
        - /usr/bin/env sh .sqa/script.pine_bubbly_dhole.sh
        container: qc.doc_plum_adventurous_antelope
      github.com/eosc-kc/keycloak markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.mahogany_loyal_lynx.sh
        container: qc.doc_jet_serene_platypus
  QC.Lic:
    repos:
      github.com/eosc-kc/keycloak licensee:
        commands:
        - /usr/bin/env sh .sqa/script.cardamom_mindful_kangaroo.sh
        container: qc.lic_cerulean_audacious_alligator
  QC.Sec:
