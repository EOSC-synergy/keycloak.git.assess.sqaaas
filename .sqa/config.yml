      github.com/eosc-kc/keycloak bandit:
        commands:
        - /usr/bin/env sh .sqa/script.mauve_hopeful_tapir.sh
        container: qc.sec_navy_eager_narwhal
  QC.Sty:
    repos:
      github.com/eosc-kc/keycloak checkstyle:
        commands:
        - /usr/bin/env sh .sqa/script.prussian_calm_shark.sh
        container: qc.sty_strawberry_warm_kraken
      github.com/eosc-kc/keycloak flake8:
        commands:
        - /usr/bin/env sh .sqa/script.ginger_dramatic_wolf.sh
        container: qc.sty_peach_warm_butterfly
      github.com/eosc-kc/keycloak hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.butter_impulsive_gorilla.sh
        container: qc.sty_incarnadine_understanding_reindeer
